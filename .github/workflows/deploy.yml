name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_branch == 'main'
    outputs:
      ci-passed: ${{ steps.check.outputs.ci-passed }}
    steps:
      - name: Check CI status
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "ci-passed=true" >> $GITHUB_OUTPUT
          else
            echo "CI workflow failed. Skipping deployment."
            echo "ci-passed=false" >> $GITHUB_OUTPUT
          fi

  deploy-render:
    needs: check-ci-status
    runs-on: ubuntu-latest
    if: needs.check-ci-status.outputs.ci-passed == 'true' && secrets.RENDER_DEPLOY_HOOK_URL != ''

    steps:
      - name: Trigger Render deploy hook
        run: curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  deploy-railway:
    needs: check-ci-status
    runs-on: ubuntu-latest
    if: needs.check-ci-status.outputs.ci-passed == 'true' && secrets.RAILWAY_DEPLOY_HOOK_URL != ''

    steps:
      - name: Trigger Railway deploy hook
        run: curl --fail --show-error --silent -X POST "$RAILWAY_DEPLOY_HOOK_URL"
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
