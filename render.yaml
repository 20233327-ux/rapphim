services:
  - type: web
    name: cinemahub
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_AUTO_MIGRATE
        value: "true"
      - key: DB_RUN_SEED
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: AUTH_ALLOW_PLAINTEXT_DEV
        value: "false"
